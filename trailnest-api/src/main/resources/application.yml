spring:
  application:
    name: trailnest-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver
    # url, username, password are set per-profile (application-dev.yml / application-prod.yml)

  jpa:
    properties:
      hibernate:
        format_sql: true    # Pretty-prints SQL in logs
    open-in-view: false     # Disable OSIV — prevents lazy loading during view rendering

  flyway:
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  cache:
    type: simple 

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:change-this-in-production-must-be-at-least-256-bits-long}
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_KEY:}
  api-secret: ${CLOUDINARY_SECRET:}

mapbox:
  access-token: ${MAPBOX_TOKEN:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.trailnest: DEBUG
    org.springframework.security: INFO
