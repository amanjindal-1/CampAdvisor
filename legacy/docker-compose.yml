services:

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: trailnest-db
    environment:
      POSTGRES_DB: trailnest
      POSTGRES_USER: trailnest
      POSTGRES_PASSWORD: trailnest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailnest -d trailnest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trailnest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
